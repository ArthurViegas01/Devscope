# =============================================================================
# netlify.toml — repo root. Netlify reads this before anything else.
# base: Netlify installs deps and runs command from this dir.
# publish: path relative to repo root where the built assets are.
# =============================================================================

[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--no-audit --no-fund"

# Serverless proxy that injects the MCP bearer token (see functions/mcp.mts).
# Path is relative to the base directory ("frontend").
[functions]
  directory = "netlify/functions"

# Health probe: plain proxy to the backend (public endpoint, no auth needed),
# so the frontend can poll same-origin /health.
[[redirects]]
  from   = "/health"
  to     = "https://devscope-production.up.railway.app/health"
  status = 200
  force  = true

# SPA: route everything through index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    # HSTS: tell browsers to always use HTTPS for this domain (1 year).
    # Remove or shorten max-age before changing from HTTPS.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CSP: adjust connect-src to match your exact Railway backend URL in
    # production (replace *.up.railway.app with the specific subdomain).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://*.up.railway.app; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
